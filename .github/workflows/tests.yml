name: Tests automatiques

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe JavaScript
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --experimental-default-type=module --check
          node --experimental-default-type=module --check service-worker.js
      - name: Tester les moteurs de maths et de lecture
        run: node --experimental-default-type=module --test tests/*.test.mjs
